# rumdl 0.3.2 (pinned in bazel/lint/tools.bzl) for every Markdown file: `bazel test //:lint_test` checks,
# `bazel run //:format` fixes (and wraps prose at 120 columns, the house line length).
[global]
line-length = 120
# MD057 (relative links resolve) is off: each file is checked on its own in a sandbox that holds only that file, so
# every relative link would look broken.
disable = ["MD057"]
exclude = [".agents", "kernel/xnu-*", "third_party", "translate/arm64e/xnu", "vendor"]

[MD013]
# Prose wraps at 120 like the code; code blocks and tables keep their lines (a wrapped command or row is wrong).
line-length = 120
code-blocks = false
tables = false
headings = false
reflow = true

[per-file-ignores]
# GitHub shows the PR template under the pull request title, which is its level 1 heading.
".github/pull_request_template.md" = ["MD041"]
# The agents' rules (CLAUDE.md links to it): each rule is a top-level section, with no title above them. A glob: rumdl
# resolves CLAUDE.md, and every file in the checks' sandbox, to its real path.
"**/AGENTS.md" = ["MD041"]
