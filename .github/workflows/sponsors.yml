name: Sponsors
on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sponsors
jobs:
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.SPONSORS_TOKEN }}
      - uses: JamesIves/github-sponsors-readme-action@v1.6.1
        with:
          token: ${{ secrets.SPONSORS_TOKEN }}
          file: README.md
      - name: Commit the README if the sponsors changed
        run: |
          if git diff --quiet README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "README: sponsors [skip ci]" README.md
          git push
