name: Release assets
on:
  workflow_call:
    inputs:
      tag:
        description: The tag being released, which must equal MODULE.bazel's version. Empty outside a release.
        type: string
        default: ""
      upload:
        description: Whether the run writes the caches.
        type: boolean
        default: false
    secrets:
      BUILDBUDDY_API_KEY:
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/bazel
        with:
          cache: release
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          upload: ${{ inputs.upload }}
      # The fork's release extension (install/release.bzl) and module version differ from the lockfile upstream
      # committed; refresh its entry here and print what to commit.
      - name: Refresh the lockfile
        run: |
          bazel mod deps --lockfile_mode=update >/dev/null
          git diff --exit-code MODULE.bazel.lock || echo "::warning::MODULE.bazel.lock changed: commit the diff above."
      - name: Read the version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          graph="$(bazel mod graph --depth=0 --color=no)"
          version="$(printf '%s\n' "$graph" | sed -n 's/^<root> (switch-ios@\(.*\))$/\1/p')"
          if [ -z "$version" ] || [ "$version" = _ ]; then
            printf '%s\n' "$graph"
            echo "::error::MODULE.bazel's module() has no version."
            exit 1
          fi
          if [ -n "$TAG" ] && [ "$TAG" != "$version" ]; then
            echo "::error::Tag $TAG is not MODULE.bazel's version $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Once per IPSW kind: the image inputs differ (kernel, loader, overlay, GPU trust), the rest is the same build.
      # xnu-12377 has DEVELOPMENT records only (kernel/xnu-12377.121.6/config/selected.bzl), so iOS 27's inputs are the
      # debug profile's: a DEVELOPMENT kernel, built to the release's failure rules.
      - run: bazel build --config=release --config=ios17 //:boot //:gpu //release:assets
      - run: bazel build --config=debug --nokeep_going --verbose_failures --config=ios27 //:boot //:gpu //release:assets
      - name: Name the assets for the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dist="$RUNNER_TEMP/dist"
          mkdir "$dist"
          for kind in release:ios17:21H461 debug:ios27:24B119; do
            profile="${kind%%:*}" build="${kind##*:}" config="${kind#*:}" config="${config%:*}"
            files="$(bazel cquery --config="$profile" --config="$config" --output=files //release:assets)"
            for f in $files; do
              name="$(basename "$f")"
              case "$name" in
                image-inputs.tar) name="image-inputs-$build.tar" ;;
                # The host tools and the SD card are the release profile's, once.
                *) [ "$profile" = release ] || continue ;;
              esac
              cp "$f" "$dist/ios-on-switch-lmao-$VERSION-$name"
            done
          done
          cd "$dist"
          shasum -a 256 -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
      - if: inputs.upload && !cancelled()
        uses: ./.github/actions/bazel-save
        with:
          cache: release
  bazelisk-only:
    needs: build
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
      - name: Remove Xcode and the Command Line Tools
        run: |
          mkdir "$RUNNER_TEMP/xcode"
          for app in /Applications/Xcode*.app; do
            sudo mv "$app" "$RUNNER_TEMP/xcode/"
          done
          sudo rm -rf /Library/Developer/CommandLineTools
          sudo xcode-select --reset
          if xcode-select -p; then
            echo "::error::A developer directory is still selected."
            exit 1
          fi
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
            - bazel/lint/tools.bzl
            - bazel/llvm/llvm.bzl
            - bazel/python/requirements_lock.txt
            - bazel/rust/crates.lock.json
            - gpu/deps.bzl
            - ipsw/pins.bzl
            - third_party/mesa/bazel/repos.bzl
          cache-save: false
          bazelrc: build --show_progress_rate_limit=30
      # The action graph, before anything runs: a regression is named by its actions, not by the first one to fail.
      - name: Check the image builder runs no compiler and nothing of Xcode
        env:
          ASSETS: ${{ runner.temp }}/assets
        run: |
          for config in ios17 ios27; do
            flags=(--repo_env=SWITCH_RELEASE_DIR="$ASSETS" --//install:prebuilt=release --config="$config" --output=text --include_commandline=false)
            graph='deps(//:image_dry_run)'
            xcode="$(bazel aquery "${flags[@]}" "inputs('.*external/(\+xcode_host\+xcode|apple_support\+|[^/]*local_config_[^/]*cc[^/]*)/.*', $graph)")"
            compiles="$(bazel aquery "${flags[@]}" "mnemonic('(Cpp|Objc|Swift|Rustc).*', $graph)")"
            found="$(printf '%s\n%s\n' "$xcode" "$compiles")"
            if grep -q '^action ' <<<"$found"; then
              grep -E "^action |^  (Mnemonic|Target):" <<<"$found"
              echo "::error:://:image_dry_run's graph ($config) has actions that need Xcode or a compiler."
              exit 1
            fi
          done
      - name: Dry-run the image builder on this build's assets
        run: |
          for config in ios17 ios27; do
            bazel run --repo_env=SWITCH_RELEASE_DIR="$RUNNER_TEMP/assets" --//install:prebuilt=release --config="$config" //:image_dry_run
          done
