name: Release
# A tag builds the assets as a run artifact (release-assets, 90 days); nothing is published.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref_name }}
jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the tag is X.Y.Z or X.Y.Z-anything
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::$TAG is neither X.Y.Z nor X.Y.Z-anything."
            exit 1
          fi
  assets:
    needs: tag
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
