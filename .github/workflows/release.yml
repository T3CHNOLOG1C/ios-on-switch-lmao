name: Release
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref_name }}
jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the tag is X.Y.Z or X.Y.Z-anything
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::$TAG is neither X.Y.Z nor X.Y.Z-anything."
            exit 1
          fi
  assets:
    needs: tag
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
  publish:
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-assets
          path: dist
      - uses: softprops/action-gh-release@v3.0.4
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
